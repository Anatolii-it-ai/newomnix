<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmnixOS</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <script>(function(){var t=localStorage.getItem('omx-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-theme',t);})();</script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css?v=13" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a href="dashboard.html" class="brand">
        <img src="logo.svg" alt="" />
        <span class="brand-name">Omnix<span class="brand-os">OS</span></span>
      </a>

      <div class="side-section" data-i18n="nav.cabinet">кабинет</div>
      <a class="side-link" href="dashboard.html"><span class="ic">◐</span> <span data-i18n="nav.personal_cabinet">Личный кабинет</span></a>

      <div class="side-section" data-i18n="nav.tools_section">инструменты</div>
      <div id="side-tools"></div>

      <div class="side-foot">
        <a id="admin-link" href="admin.html" style="display:none; color: var(--violet);" data-i18n="nav.admin_panel">→ Админ-панель</a>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <button class="menu-toggle" id="menu-toggle" data-i18n-aria="nav.menu" aria-label="Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
        </button>
        <h1 id="page-title">…</h1>
        <div class="topbar-actions">
          <button id="search-btn" class="bell" type="button" data-i18n-title="common.search" title="Поиск (Ctrl+K)" aria-label="Search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          </button>
          <button id="theme-toggle" type="button"></button>
          <select class="lang-switch" id="lang-switch" aria-label="Language"></select>
          <div class="user-pill">
            <span class="avatar" id="topbar-avatar">?</span>
            <span id="topbar-name">…</span>
          </div>
          <button class="btn btn-ghost btn-sm" id="logout-btn" data-i18n="auth.btn_logout">Выйти</button>
        </div>
      </div>

      <div class="tool-shortcuts" id="tool-shortcuts" aria-label="Инструменты"></div>
      <div id="tool-root"></div>
    </main>
  </div>

  <div id="modal-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js?v=1"></script>
  <script src="i18n.js?v=2"></script>
  <script src="auth.js?v=5"></script>
  <script src="palette.js?v=1"></script>
  <script src="tools.js?v=8"></script>
  <script>
  (async () => {
    renderLangSwitcher('lang-switch');
    renderThemeToggle('theme-toggle');
    document.getElementById('search-btn').addEventListener('click', () => openCommandPalette());
    const session = await requireAuth();
    if (!session) return;
    const user = session.user;
    const profile = await omxGetProfile();
    const displayName = profile?.name || user.email;

    document.getElementById('topbar-name').textContent = displayName;
    document.getElementById('topbar-avatar').textContent = displayName[0].toUpperCase();
    if (profile?.role === 'admin') document.getElementById('admin-link').style.display = 'block';

    const slug = new URLSearchParams(location.search).get('slug') || 'dashboard';

    const { data: utRows } = await sb
      .from('user_tools')
      .select('tool:tools(slug, name, icon, enabled)')
      .eq('user_id', user.id);
    const SLUG_ORDER = ['dashboard', 'goals', 'tasks', 'planner', 'habits', 'finances', 'health', 'reviews', 'journal', 'ai', 'gamification'];
    const orderOf = (s) => { const i = SLUG_ORDER.indexOf(s); return i === -1 ? 999 : i; };
    const tools = (utRows || []).map(r => r.tool).filter(t => t && t.enabled).sort((a, b) => orderOf(a.slug) - orderOf(b.slug));
    const sideTools = document.getElementById('side-tools');

    function tToolName(tl) {
      const k = `tools.${tl.slug}.name`;
      const v = t(k);
      return (v && v !== k) ? v : tl.name;
    }

    function renderSideTools() {
      if (!tools.length) {
        sideTools.innerHTML = `<p class="muted" style="padding:8px; font-size:12px">${esc(t('tool.no_available'))}</p>`;
        return;
      }
      sideTools.innerHTML = tools.map(tl => `
        <a class="side-link ${tl.slug === slug ? 'active' : ''}" href="tool.html?slug=${tl.slug}">
          <span class="ic">${esc(tToolIcon(tl.slug, tl.icon))}</span> ${esc(tToolName(tl))}
        </a>
      `).join('');
    }
    function renderTopShortcuts() {
      const wrap = document.getElementById('tool-shortcuts');
      if (!wrap) return;
      wrap.innerHTML = tools.map(tl => {
        const name = tToolName(tl);
        return `
          <a class="tool-shortcut ${tl.slug === slug ? 'active' : ''}" href="tool.html?slug=${tl.slug}" aria-label="${esc(name)}" title="${esc(name)}">
            <span>${esc(tToolIcon(tl.slug, tl.icon))}</span>
            <span class="ts-tip">${esc(name)}</span>
          </a>
        `;
      }).join('');
    }
    renderSideTools();
    renderTopShortcuts();

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await omxLogout();
      location.href = 'login.html';
    });

    // Подтянуть пользовательские сферы (если кастомизированы) для всех инструментов
    if (typeof refreshUserSpheres === 'function') await refreshUserSpheres();

    const tool = window.OmnixTools[slug];
    const root = document.getElementById('tool-root');
    if (!tool) {
      document.getElementById('page-title').textContent = t('tool.not_found');
      root.innerHTML = `<div class="card"><p class="muted">${t('tool.not_implemented', { slug })}</p></div>`;
      return;
    }

    async function renderTool() {
      const title = t(`tools.${slug}.title`);
      document.getElementById('page-title').textContent = (title && title !== `tools.${slug}.title`) ? title : tool.title;
      try {
        await tool.render(root);
      } catch (e) {
        console.error(e);
        root.innerHTML = `<div class="card"><p class="muted">${t('tool.load_error', { msg: esc(e.message) })}</p></div>`;
      }
    }

    document.addEventListener('langchange', () => {
      renderSideTools();
      renderTopShortcuts();
      renderTool();
    });

    await renderTool();
  })();
  </script>
</body>
</html>
