<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="auth.reset_title">Новый пароль — OmnixOS</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css?v=7" />
</head>
<body>
  <main class="auth-wrap">
    <select class="lang-switch" id="lang-switch" aria-label="Language"></select>
    <section class="auth-card">
      <a href="/" class="brand">
        <img src="logo.svg" alt="" />
        <span class="brand-name">Omnix<span class="brand-os">OS</span></span>
      </a>
      <h1 data-i18n="auth.reset_title">Новый пароль</h1>
      <p class="auth-sub" data-i18n="auth.reset_sub">Введи новый пароль (минимум 8 символов)</p>
      <form id="reset-form">
        <div class="field">
          <label for="password" data-i18n="auth.new_password">Новый пароль</label>
          <input id="password" name="password" type="password" minlength="8" required />
        </div>
        <button type="submit" class="btn btn-primary" data-i18n="auth.btn_save_password">Сохранить пароль</button>
      </form>
      <p class="auth-foot"><a href="login.html" data-i18n="auth.back_to_login_full">← Вернуться ко входу</a></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js?v=1"></script>
  <script src="i18n.js?v=1"></script>
  <script src="auth.js?v=5"></script>
  <script>
    renderLangSwitcher('lang-switch');
    (async () => {
      await new Promise(r => setTimeout(r, 300));
      const session = await omxGetSession();
      if (!session) {
        toast(t('auth.reset_link_invalid'), 'error');
      }
    })();

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const r = await omxUpdatePassword(fd.get('password'));
      if (r.ok) {
        toast(t('auth.password_updated'), 'success');
        await omxLogout();
        setTimeout(() => location.href = 'login.html', 800);
      } else {
        toast(t('common.error_with_msg', { msg: r.error || '—' }), 'error');
      }
    });
  </script>
</body>
</html>
