<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="auth.register_title">Регистрация — OmnixOS</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <script>(function(){var t=localStorage.getItem('omx-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css?v=12" />
</head>
<body>
  <main class="auth-wrap">
    <button id="theme-toggle" type="button"></button>
    <select class="lang-switch" id="lang-switch" aria-label="Language"></select>
    <section class="auth-card">
      <a href="/" class="brand">
        <img src="logo.svg" alt="" />
        <span class="brand-name">Omnix<span class="brand-os">OS</span></span>
      </a>

      <h1 data-i18n="auth.register_title">Регистрация</h1>
      <p class="auth-sub" data-i18n="auth.register_sub">Создай аккаунт за 30 секунд</p>

      <form id="reg-form">
        <div class="field">
          <label for="name" data-i18n="auth.name">Как тебя зовут</label>
          <input id="name" name="name" type="text" autocomplete="name" />
        </div>
        <div class="field">
          <label for="email" data-i18n="auth.email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password" data-i18n="auth.password_min">Пароль (мин. 8 символов)</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />
        </div>
        <button type="submit" class="btn btn-primary" data-i18n="auth.btn_register">Создать аккаунт</button>
      </form>

      <div class="auth-divider" data-i18n="auth.or">или</div>
      <div class="auth-providers">
        <button type="button" class="provider-btn" id="google-btn" data-provider="google">
          <svg viewBox="0 0 24 24"><path fill="#fff" d="M22.5 12.27c0-.85-.07-1.66-.2-2.45H12v4.64h5.92a5.07 5.07 0 0 1-2.2 3.32v2.77h3.55c2.08-1.92 3.28-4.74 3.28-8.28z"/><path fill="#fff" opacity=".6" d="M12 23c2.97 0 5.46-.98 7.28-2.65l-3.55-2.77c-.98.66-2.24 1.05-3.73 1.05-2.87 0-5.3-1.94-6.17-4.55H2.18v2.86A11 11 0 0 0 12 23z"/></svg>
          <span data-i18n="auth.btn_google_continue">Продолжить с Google</span>
        </button>
      </div>

      <p class="auth-foot">
        <span data-i18n="auth.has_account">Уже есть аккаунт?</span> <a href="login.html" data-i18n="auth.btn_login">Войти</a>
      </p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js?v=1"></script>
  <script src="i18n.js?v=1"></script>
  <script src="auth.js?v=5"></script>
  <script>
    requireGuest();
    checkProviders();
    renderLangSwitcher('lang-switch');
    renderThemeToggle('theme-toggle');

    document.getElementById('reg-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const name = fd.get('name');
      const email = fd.get('email');
      const password = fd.get('password');
      const r = await omxRegister(email, password, name);
      if (r.ok) {
        await savePasswordCredential(email, password, name);
        if (r.needsVerify) {
          toast(t('auth.account_created'), 'success');
          setTimeout(() => location.href = 'verify.html?email=' + encodeURIComponent(email), 1200);
        } else {
          toast(t('auth.welcome_excl'), 'success');
          setTimeout(() => location.href = 'dashboard.html', 600);
        }
      } else {
        const m = (r.error || '').toLowerCase();
        const msg =
          m.includes('already') || m.includes('registered') ? t('auth.err_email_taken') :
          m.includes('invalid') && m.includes('email')      ? t('auth.err_email_invalid') :
          m.includes('password')                            ? t('auth.err_password_short') :
          t('auth.err_register');
        toast(msg, 'error');
      }
    });

    document.getElementById('google-btn').addEventListener('click', async () => {
      const r = await omxOAuthGoogle();
      if (!r.ok) toast(t('auth.err_google_not_configured'), 'error');
    });
  </script>
</body>
</html>
