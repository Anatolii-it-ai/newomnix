<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="OmnixOS">
  <defs>
    <linearGradient id="omx-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="55%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="omx-core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#22D3EE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer ring: the OS shell -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="url(#omx-grad)" stroke-width="2.4"/>

  <!-- Eight life-sphere ticks around the ring -->
  <g stroke="url(#omx-grad)" stroke-width="2.2" stroke-linecap="round">
    <line x1="32" y1="3"  x2="32" y2="9"/>
    <line x1="52.5" y1="11.5" x2="48.2" y2="15.8"/>
    <line x1="61" y1="32" x2="55" y2="32"/>
    <line x1="52.5" y1="52.5" x2="48.2" y2="48.2"/>
    <line x1="32" y1="61" x2="32" y2="55"/>
    <line x1="11.5" y1="52.5" x2="15.8" y2="48.2"/>
    <line x1="3"  y1="32" x2="9"  y2="32"/>
    <line x1="11.5" y1="11.5" x2="15.8" y2="15.8"/>
  </g>

  <!-- Inner orbit -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="url(#omx-grad)" stroke-width="1.4" stroke-dasharray="2 3" opacity="0.7"/>

  <!-- Core glow -->
  <circle cx="32" cy="32" r="14" fill="url(#omx-core)"/>

  <!-- Monogram: stylised X formed by two interlocking arcs -->
  <path d="M22 22 Q32 32 42 42" fill="none" stroke="url(#omx-grad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M42 22 Q32 32 22 42" fill="none" stroke="url(#omx-grad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Core dot -->
  <circle cx="32" cy="32" r="2.4" fill="#fff"/>
</svg>
