<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — OmnixOS</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css?v=3" />
</head>
<body>
  <main class="auth-wrap">
    <section class="auth-card">
      <a href="/" class="brand">
        <img src="logo.svg" alt="" />
        <span class="brand-name">Omnix<span class="brand-os">OS</span></span>
      </a>

      <h1>Вход</h1>
      <p class="auth-sub">Войди и продолжай управлять жизнью</p>

      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Пароль</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary">Войти</button>
      </form>

      <div class="auth-divider">или</div>
      <div class="auth-providers">
        <a href="/api/auth/google" class="provider-btn" data-provider="google">
          <svg viewBox="0 0 24 24"><path fill="#fff" d="M22.5 12.27c0-.85-.07-1.66-.2-2.45H12v4.64h5.92a5.07 5.07 0 0 1-2.2 3.32v2.77h3.55c2.08-1.92 3.28-4.74 3.28-8.28z"/><path fill="#fff" opacity=".6" d="M12 23c2.97 0 5.46-.98 7.28-2.65l-3.55-2.77c-.98.66-2.24 1.05-3.73 1.05-2.87 0-5.3-1.94-6.17-4.55H2.18v2.86A11 11 0 0 0 12 23z"/><path fill="#fff" opacity=".4" d="M5.83 14.08A6.6 6.6 0 0 1 5.45 12c0-.72.13-1.42.38-2.08V7.06H2.18A11 11 0 0 0 1 12c0 1.78.43 3.46 1.18 4.94l3.65-2.86z"/><path fill="#fff" opacity=".2" d="M12 5.38c1.62 0 3.07.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1A11 11 0 0 0 2.18 7.06l3.65 2.86C6.7 7.32 9.13 5.38 12 5.38z"/></svg>
          Войти через Google
        </a>
        <button type="button" class="provider-btn" id="tg-login-btn" data-provider="telegram">
          <svg viewBox="0 0 24 24"><path fill="#22D3EE" d="M22 4 2.5 11l5.5 2 2 6.5 3.5-3.5 5 4 4-16zm-4.5 4-7 6.5L10 17l-1-3 8-7z"/></svg>
          Войти через Telegram
        </button>
      </div>

      <p class="auth-foot">
        Нет аккаунта? <a href="register.html">Создать</a><br/>
        <a href="forgot.html">Забыл пароль</a>
      </p>
    </section>
  </main>

  <script src="auth.js?v=3"></script>
  <script>
    requireGuest();
    checkProviders();
    const urlError = new URLSearchParams(location.search).get('error');
    if (urlError) {
      const map = { google_not_configured: 'Google OAuth не настроен — попроси администратора добавить ключи в .env' };
      setTimeout(() => toast(map[urlError] || urlError, 'error'), 100);
    }
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const email = fd.get('email');
      const password = fd.get('password');
      const r = await api('POST', '/api/auth/login', { email, password });
      if (r.ok) {
        await savePasswordCredential(email, password, r.user?.name);
        toast('Добро пожаловать', 'success');
        const next = new URLSearchParams(location.search).get('next') || 'dashboard.html';
        location.href = next;
      } else {
        const map = { invalid_credentials: 'Неверный email или пароль', account_blocked: 'Аккаунт заблокирован' };
        toast(map[r.error] || 'Ошибка входа', 'error');
      }
    });

    document.getElementById('tg-login-btn').addEventListener('click', () => {
      toast('Telegram-логин: настрой TELEGRAM_BOT_USERNAME в .env и подключи Login Widget', 'error');
    });
  </script>
</body>
</html>
