<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Подтверждение email — OmnixOS</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css?v=3" />
</head>
<body>
  <main class="auth-wrap">
    <section class="auth-card">
      <a href="/" class="brand">
        <img src="logo.svg" alt="" />
        <span class="brand-name">Omnix<span class="brand-os">OS</span></span>
      </a>
      <h1 id="title">Проверяем…</h1>
      <p class="auth-sub" id="sub">Подождите секунду</p>
      <a href="dashboard.html" class="btn btn-primary" id="cta" style="display:none">В личный кабинет</a>
      <p class="auth-foot" id="foot" style="display:none"><a href="login.html">← Войти</a></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js?v=1"></script>
  <script src="auth.js?v=4"></script>
  <script>
    // Supabase сам подтверждает email при клике по ссылке — она ведёт сюда с токеном в hash,
    // и detectSessionInUrl=true создаёт сессию. Нам остаётся только показать статус.
    (async () => {
      const $t = document.getElementById('title');
      const $s = document.getElementById('sub');
      const params = new URLSearchParams(location.search);

      // Дать SDK секунду на парсинг hash
      await new Promise(r => setTimeout(r, 300));
      const session = await omxGetSession();

      if (session) {
        $t.textContent = 'Email подтверждён ✓';
        $s.textContent = 'Все модули OmnixOS открыты.';
        document.getElementById('cta').style.display = 'inline-flex';
        return;
      }

      // Юзер пришёл сюда после регистрации — ждёт письмо
      const email = params.get('email');
      if (email) {
        $t.textContent = 'Письмо отправлено';
        $s.innerHTML = `Открой <b>${esc(email)}</b> и кликни по ссылке для подтверждения.`;
        document.getElementById('foot').style.display = 'block';
        return;
      }

      // Иначе ссылка устарела
      $t.textContent = 'Ссылка недействительна';
      $s.textContent = 'Возможно, срок истёк или ссылка уже использована.';
      document.getElementById('foot').style.display = 'block';
    })();
  </script>
</body>
</html>
