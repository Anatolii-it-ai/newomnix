<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmnixOS</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <script>(function(){var t=localStorage.getItem('omx-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-theme',t);})();</script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css?v=18" />
</head>
<body>
  <main class="auth-wrap">
    <button id="theme-toggle" type="button"></button>
    <select class="lang-switch" id="lang-switch" aria-label="Language"></select>
    <section class="auth-card">
      <a href="/" class="brand">
        <img src="logo.svg" alt="" />
        <span class="brand-name">Omnix<span class="brand-os">OS</span></span>
      </a>
      <h1 id="title" data-i18n="auth.verify_checking">Проверяем…</h1>
      <p class="auth-sub" id="sub" data-i18n="auth.verify_wait">Подождите секунду</p>
      <a href="dashboard.html" class="btn btn-primary" id="cta" style="display:none" data-i18n="auth.to_cabinet">В личный кабинет</a>
      <p class="auth-foot" id="foot" style="display:none"><a href="login.html" data-i18n="auth.back_to_login">← Войти</a></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js?v=1"></script>
  <script src="i18n.js?v=5"></script>
  <script src="auth.js?v=5"></script>
  <script>
    renderLangSwitcher('lang-switch');
    renderThemeToggle('theme-toggle');
    (async () => {
      const $t = document.getElementById('title');
      const $s = document.getElementById('sub');
      const params = new URLSearchParams(location.search);

      await new Promise(r => setTimeout(r, 300));
      const session = await omxGetSession();

      if (session) {
        $t.textContent = t('auth.verify_confirmed');
        $s.textContent = t('auth.verify_open');
        document.getElementById('cta').style.display = 'inline-flex';
        return;
      }

      const email = params.get('email');
      if (email) {
        $t.textContent = t('auth.verify_sent_title');
        $s.innerHTML = t('auth.verify_sent_body', { email: esc(email) });
        document.getElementById('foot').style.display = 'block';
        return;
      }

      $t.textContent = t('auth.verify_invalid');
      $s.textContent = t('auth.verify_invalid_body');
      document.getElementById('foot').style.display = 'block';
    })();
  </script>
</body>
</html>
